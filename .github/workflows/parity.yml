name: Parity Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  parity:
    name: Verify DB / API / DTO parity against baseline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run parity verify
        run: ./tools/parity/ci-parity.sh
